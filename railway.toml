# Railway Configuration for Portfolio Builder
# MADFAM Portfolio Builder Platform

[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment configuration
[env]
NODE_ENV = "production"
PORT = "3000"

# Service configuration
[service]
internalPort = 3000
protocol = "http"

# Cron job configuration for scheduled tasks
# These will run on Railway's infrastructure, not Vercel
[[crons]]
name = "Daily Cleanup"
schedule = "0 2 * * *"  # Daily at 2 AM UTC
command = '''
curl -X POST \
  -H "X-API-Key: $CRON_API_KEY" \
  -H "Content-Type: application/json" \
  https://portfolio-builder.madfam.io/api/cron/cleanup
'''

[[crons]]
name = "Analytics Aggregation"
schedule = "0 */6 * * *"  # Every 6 hours
command = '''
curl -X POST \
  -H "X-API-Key: $CRON_API_KEY" \
  -H "Content-Type: application/json" \
  https://portfolio-builder.madfam.io/api/cron/analytics
'''

# Optional: Add more cron jobs as needed
# [[crons]]
# name = "Weekly Report"
# schedule = "0 9 * * 1"  # Mondays at 9 AM UTC
# command = '''
# curl -X POST \
#   -H "X-API-Key: $CRON_API_KEY" \
#   https://portfolio-builder.madfam.io/api/cron/weekly-report
# '''

# Resource limits (adjust based on your Railway plan)
[resources]
memory = "512Mi"
cpu = "0.5"

# Scaling configuration
[scaling]
minInstances = 1
maxInstances = 3

# Network configuration
[network]
enablePublicDomain = true

# Monitoring
[observability]
logsEnabled = true
metricsEnabled = true